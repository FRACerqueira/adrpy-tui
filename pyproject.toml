[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "adrpy-tui"
dynamic = ["version"]
description = "Interactive terminal UI for adrpy -- guided, human-friendly ADR management that runs every change through the adrpy CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Fernando Cerqueira" },
]
keywords = ["adr", "architecture-decision-records", "tui", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
# adrpy-ai with the series adrpy-tui was validated against, no URL; the
# start-up check reads this same range from the installed metadata (ADR003V01).
dependencies = ["adrpy-ai>=0.1.dev0,<0.2", "textual>=8.2"]

[project.urls]
Homepage = "https://github.com/FRACerqueira/adrpy-tui"
Repository = "https://github.com/FRACerqueira/adrpy-tui"
Issues = "https://github.com/FRACerqueira/adrpy-tui/issues"

[project.scripts]
adrpy-tui = "adrpy_tui.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# In parallel, one worker per CPU; tests marked xdist_group share a worker
# (test_sample_repo.py builds its repositories once).
addopts = "-n auto --dist loadgroup"

[tool.hatch.build.targets.wheel]
packages = ["src/adrpy_tui"]
# The documentation's image, not used by the package: kept in the sdist only.
exclude = ["src/adrpy_tui/icon.png"]

[tool.hatch.build.targets.sdist]
# Repository-only material: the CI workflows, the release's manual checklist and
# the project's own decision log.
exclude = [".github/", "doc/manual-test-checklist.md", "doc/decision-log/"]

[tool.hatch.version]
source = "vcs"
