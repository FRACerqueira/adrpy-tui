name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # adrpy-ai is not on PyPI yet (ADR0003V01).
      - name: Install adrpy-ai from git
        run: pip install "git+https://github.com/FRACerqueira/adrpy-ai.git@develop"

      - name: Install adrpy-tui (dev)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the console script
        run: adrpy-tui --version
